services:

  backend:
    build: .
    container_name: quiz_backend
    env_file:
      - .env
    ports:
      - "88:80"
    depends_on:
      db:
        condition: service_healthy
    restart: always

  redis:
    image: redis:8
    container_name: quiz_redis
    ports:
      - "6379:6379"
    restart: always

  db:
    image: postgres:17
    container_name: quiz_db
    env_file:
      - .env
    ports:
      - "5445:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_data:
